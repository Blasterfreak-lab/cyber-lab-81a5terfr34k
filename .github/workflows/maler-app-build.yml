name: Build Maler APK
on:
  push:
    branches: ["maler-app-build"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Rebuild generated MainActivity
        run: |
          mkdir -p maler-app/app/src/main/java/de/maler/aufmass
          cat maler-app/.buildsrc/MainActivity.part1 maler-app/.buildsrc/MainActivity.part2 > maler-app/app/src/main/java/de/maler/aufmass/MainActivity.java
      - name: Build debug APK
        working-directory: maler-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MalerAufmass-debug-apk
          path: maler-app/app/build/outputs/apk/debug/app-debug.apk
